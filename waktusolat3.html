<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <body style="background-color: #84286B;">
    <table style="background-color: #84286B;" width="170" height="236" border="0" cellpadding="0" cellspacing="0"> 
      <tbody>
        <tr>
          <td height="30" align="center">
            <table width="100%" align="right" border="0">
              <tbody>
                <tr>
                  <td align="center">
                    <font color="#0ea974" size="3"><b>WAKTU SOLAT</b></font>
                  </td>
                </tr>
                <tr>
                  <td align="center">
                    <font color="#F2F3AA" size="2" face="Arial,Tahoma,Arial">
                      <b id="location">Loading...</b>
                    </font>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
        <tr>
          <td height="150" align="center">
            <table width="50%" align="center" border="0" cellpadding="0" cellspacing="0" id="prayerTimes">
              <!-- Dynamic prayer times will be inserted here -->
            </table>
            <table width="100%" align="center" border="0" cellpadding="0" cellspacing="0">
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
  <script>
    const API_URL = 'https://api.aladhan.com/v1/timingsByCity?city=Petaling%20Jaya&country=Malaysia';
    const prayerTimesTable = document.getElementById('prayerTimes');
    const locationElement = document.getElementById('location');
    const loadingElement = document.getElementById('loading');

    async function fetchPrayerTimes() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data.code === 200) {
          // Extract timings
          const { timings } = data.data;
          const prayers = [
            { name: 'Imsak', time: timings.Imsak },
            { name: 'Subuh', time: timings.Fajr },
            { name: 'Zohor', time: timings.Dhuhr },
            { name: 'Asar', time: timings.Asr },
            { name: 'Maghrib', time: timings.Maghrib },
            { name: 'Isyak', time: timings.Isha },
          ];

          // Update location
          locationElement.textContent = `${data.data.meta.timezone}, (${data.data.meta.method.name})`;

          // Populate prayer times table
          prayerTimesTable.innerHTML = prayers.map(prayer => `
            <tr>
              <td align="left">
                <font size="2" color="#FDE7E7"><b>${prayer.name}</b></font>
              </td>
              <td align="left">
                <font size="2" color="#FFFFFF"><b>${prayer.time}</b></font>
              </td>
            </tr>
          `).join('');

          // Hide the loading text
          loadingElement.style.display = 'none';
        } else {
          // Show error if API doesn't return success code
          loadingElement.textContent = 'Error fetching prayer times';
          prayerTimesTable.innerHTML = `<tr><td colspan="2" style="color: red;">Error fetching prayer times</td></tr>`;
        }
      } catch (error) {
        // Handle network or fetch errors
        console.error('Error fetching prayer times:', error);
        loadingElement.textContent = 'Failed to load prayer times';
        prayerTimesTable.innerHTML = `<tr><td colspan="2" style="color: red;">Failed to load prayer times</td></tr>`;
      }
    }

    // Fetch prayer times on page load
    fetchPrayerTimes();
  </script>
</body>
</html>
